name=OpenHornetDiagnostics
version=0.3.0
author=OpenHornet
maintainer=OpenHornet
sentence=Backlight power-on test, DCS sync flash and diagnostic mode for the OpenHornet DDI and AMPCD boards.
paragraph=Non-blocking helper used by the 1A3, 1A9 and 2A3A1 sketches. Drives a plain LED backlight on a PWM pin by default, or a WS2812 backlight string through OpenHornetWs2812Backlight.h (data pin and pixel count set per board). Not for other panels. Hold three pushbuttons for three seconds to enter or exit diagnostic mode; only available while no DCS mission is running (OpenHornetDcsMission.h).
